<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive two-player Tic Tac Toe game built with HTML, CSS and JavaScript.">
    <title>Tic Tac Toe | Two Player Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <h1>🎮 Tic Tac Toe</h1>

        <p class="subtitle">
            A classic two-player browser game
        </p>

        <section class="scoreboard">

            <div class="score">
                <span>Player X</span>
                <strong id="scoreX">0</strong>
            </div>

            <div class="score">
                <span>Draws</span>
                <strong id="scoreDraw">0</strong>
            </div>

            <div class="score">
                <span>Player O</span>
                <strong id="scoreO">0</strong>
            </div>

        </section>

        <div
            class="status"
            id="status"
            aria-live="polite">
            Player X's turn
        </div>

        <section
            class="board"
            id="board"
            aria-label="Tic Tac Toe board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </section>

        <div class="controls">

            <button
                class="control-btn"
                id="resetGame">
                🔄 New Game
            </button>

            <button
                class="control-btn"
                id="resetScore">
                🏆 Reset Score
            </button>

        </div>

        <footer>
            Built with HTML, CSS &amp; JavaScript
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
